<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Surf80 Support</title>
  <meta name="description" content="Support for the Surf80 healthspan app.">
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #ffffff;
      color: #1d1d1f;
    }

    main {
      max-width: 680px;
      margin: 0 auto;
      padding: 80px 24px;
    }

    h1 {
      font-size: 40px;
      margin-bottom: 16px;
    }

    p {
      font-size: 18px;
      line-height: 1.6;
      color: #4b4b4b;
    }

    a {
      color: #008c95;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    .contact {
      margin-top: 36px;
      padding: 24px;
      background: #f5f5f7;
      border-radius: 16px;
    }

    footer {
      margin-top: 64px;
      font-size: 14px;
      color: #86868b;
    }
  </style>
</head>

<body>
  <main>
    <h1>Surf80 Support</h1>

    <p>
      Need help with Surf80? We’re here to help.
    </p>

    <div class="contact">
      <strong>Email</strong>
      <p>
        <a href="mailto:support@surf80.com">support@surf80.com</a>
      </p>
    </div>

    <p>
      When contacting us, please include a short description of the issue and,
      if relevant, your iPhone model and iOS version.
    </p>

    <footer>
      © 2026 Surf80
    </footer>
  </main>
</body>
</html>
